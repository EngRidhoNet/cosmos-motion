name: CosmosMotion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 cli/cosmos.py verify templates/nikolai-vavilov
      - run: python3 cli/cosmos.py verify templates/michael-faraday
